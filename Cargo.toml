[package]
name = "veyra"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "A spatial Wayland compositor"
license = "MIT"

[dependencies]
smithay = { version = "0.7", default-features = false, features = [
    "backend_winit",
    "backend_drm",
    "backend_gbm",
    "backend_egl",
    "backend_session_libseat",
    "backend_libinput",
    "backend_udev",
    "wayland_frontend",
    "desktop",
    "renderer_gl",
] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
cgmath = "0.18"
toml = "0.8"

