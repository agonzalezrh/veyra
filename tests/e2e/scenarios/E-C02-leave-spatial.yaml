# E-C02 — Leave spatial mode (F5): 2D presentation restored, application
# geometry/content retained, no surface content loss.
api: e2e/1
id: E-C02
title: "Leave spatial mode (F5) — normal presentation restored, content intact"
category: spatial
priority: daily
tags: [spatial, visual]
stack: x11
timeout_s: 120

requires:
  binaries: [veyra, client-kit]
  tools: [Xvfb, xdotool, import, identify, compare, python3]

veyra:
  args: ["--normal"]

steps:
  - launch:
      kit: probe
      args: ["--duration", "24000"]
      app_id: probe-a
      json: probe_a.json

  - wait_log:
      pattern: "surface mapped"
      app_id: probe-a
      within_s: 10
      anchor: probe_mapped

  - focus_x11: {}
  - click: {x: "{{ CX }}", y: "{{ CY }}"}

  - capture:
      name: baseline-normal
      category: S0
      stability: {max_changed_pct: 0.3, timeout_s: 6}
      image_checks: [not_black, not_white, size_matches_display]

  - key: {key: F5}
  - wait_stable: {max_changed_pct: 0.3, timeout_s: 6}
  - capture:
      name: stable-spatial
      category: S1
      stability: {max_changed_pct: 0.3, timeout_s: 6}
      image_checks: [not_black, not_white, size_matches_display]

  - key: {key: F5}
  - wait_stable: {max_changed_pct: 0.3, timeout_s: 6}

  - capture:
      name: restored-normal
      category: S3
      stability: {max_changed_pct: 0.3, timeout_s: 6}
      image_checks: [not_black, not_white, size_matches_display, {region_not_uniform: taskbar}]
      vlm:
        template: compare
        required: true
        min_confidence: 0.7
        compare_with: baseline-normal
        expected:
          spatial_mode: false
          perspective: flat
          taskbar: visible
          anomalies_max: 0
        question: "The restored frame should match the baseline presentation; the window content must be intact and no window may have disappeared or duplicated."

  - assert:
      client_json: {file: probe_a.json, expr: "sum(1 for e in events if e['ev']=='commit') >= 5"}
  - assert: {log_not_contains: {pattern: "surface destroyed", since: probe_mapped}}
  - assert: {log_not_contains: {pattern: "panicked"}}
  - assert: {process_alive: {name: veyra}}
