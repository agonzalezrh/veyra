# E-AP01 — 3D visual corruption sweep: six windows tiled via Meta+L Grid
# layout, cycled through spatial, orbit, zoom, overview, workspace overview
# and focus mode in DEFAULT (spatial) startup mode — camera modes only move
# the camera there, so every state change is visible. Every stable state gets
# a VLM anomaly scan (ghosts, detached decorations, duplicates, black/white
# surfaces, clipping).
api: e2e/1
id: E-AP01
title: "3D visual corruption sweep across compositor modes (VLM)"
category: rendering
priority: nightly
tags: [visual, vlm, modes]
stack: x11
timeout_s: 420

requires:
  binaries: [veyra, client-kit]
  tools: [Xvfb, xdotool, import, identify, compare, python3]

veyra:
  args: []

steps:
  - launch: {kit: probe, args: ["--duration", "600000", "--resize-to", "400x300", "--after-commits", "2"], app_id: probe-1, json: probe_1.json}
  - launch: {kit: probe, args: ["--duration", "600000", "--resize-to", "400x300", "--after-commits", "2"], app_id: probe-2}
  - launch: {kit: probe, args: ["--duration", "600000", "--resize-to", "400x300", "--after-commits", "2"], app_id: probe-3}

  - wait_log:
      pattern: "surface mapped"
      app_id: probe-3
      within_s: 20
      anchor: all_mapped

  - focus_x11: {}
  - key: {key: Escape}
  # Meta+L x2: Freeform -> Flat -> Grid{columns:3} — deterministic 3x2 tiling
  - chord: {mods: [super], key: l}
  - chord: {mods: [super], key: l}
  - assert:
      log_contains: {pattern: "layout mode cycled", within_s: 5}
  - wait_stable: {max_changed_pct: 0.5, timeout_s: 10}

  # Overview is a camera mode that frames every window — the canonical
  # "all windows visible" state (must never duplicate or drop windows)
  - chord: {mods: [super], key: o}
  - wait_stable: {max_changed_pct: 0.5, timeout_s: 10}
  - capture:
      name: overview-all
      category: S0
      stability: {max_changed_pct: 0.5, timeout_s: 8}
      image_checks: [not_black, not_white, size_matches_display, {region_not_uniform: taskbar}]
      vlm:
        template: anomaly
        required: true
        min_confidence: 0.7
        expected:
          windows: ["three client-kit test windows"]
          taskbar: visible
          anomalies_max: 0
        question: "Overview mode must show all three windows exactly once; no window may be duplicated, missing, or corrupted."

  # probe-3 still holds keyboard focus (focus-on-map): F6 is deterministic here
  - key: {key: F6}
  - wait_stable: {max_changed_pct: 0.5, timeout_s: 10}
  - capture:
      name: focus-mode
      category: S2
      stability: {max_changed_pct: 0.5, timeout_s: 8}
      image_checks: [not_black, not_white, size_matches_display]
      vlm:
        template: anomaly
        required: true
        min_confidence: 0.7
        expected:
          taskbar: visible
          anomalies_max: 0
        question: "Focus mode: the camera emphasis is on the selected window; no corruption, no duplicated decorations."

  - key: {key: Escape}
  - click: {x: 60, y: 60}
  - wait_stable: {max_changed_pct: 0.5, timeout_s: 10}
  - capture:
      name: spatial-grid
      category: S2
      stability: {max_changed_pct: 0.5, timeout_s: 8}
      image_checks: [not_black, not_white, size_matches_display]
      vlm:
        template: anomaly
        required: true
        min_confidence: 0.7
        expected:
          windows: ["client-kit test windows"]
          spatial_mode: true
          perspective: increased
          taskbar: visible
          anomalies_max: 0

  - drag: {from: ["{{ CX }}", "{{ CY - 40 }}"], to: ["{{ CX + 200 }}", "{{ CY + 40 }}"], button: 3, steps: 8, step_delay_ms: 120}
  - wait_stable: {max_changed_pct: 0.5, timeout_s: 10}
  - capture:
      name: orbit
      category: S2
      stability: {max_changed_pct: 0.5, timeout_s: 8}
      image_checks: [not_black, not_white, size_matches_display]
      vlm:
        template: anomaly
        required: true
        min_confidence: 0.7
        expected:
          spatial_mode: true
          taskbar: visible
          anomalies_max: 0
        question: "The viewpoint must be orbited; the windows must keep their relative arrangement and remain intact."

  - scroll: {x: 60, y: 60, direction: up, clicks: 3}
  - wait_stable: {max_changed_pct: 0.5, timeout_s: 10}
  - capture:
      name: zoom
      category: S2
      stability: {max_changed_pct: 0.5, timeout_s: 8}
      image_checks: [not_black, not_white, size_matches_display]
      vlm:
        template: anomaly
        required: true
        min_confidence: 0.7
        expected:
          spatial_mode: true
          taskbar: visible
          anomalies_max: 0

  - chord: {mods: [super], key: o}
  - wait_stable: {max_changed_pct: 0.5, timeout_s: 10}
  - capture:
      name: window-overview
      category: S2
      stability: {max_changed_pct: 0.5, timeout_s: 8}
      image_checks: [not_black, not_white, size_matches_display]
      vlm:
        template: anomaly
        required: true
        min_confidence: 0.7
        expected:
          windows: ["three client-kit test windows"]
          taskbar: visible
          anomalies_max: 0
        question: "Overview re-entry after camera movement: every window must be visible exactly once — no duplication, no missing window."

  - key: {key: Escape}
  - wait_stable: {max_changed_pct: 0.5, timeout_s: 10}

  - chord: {mods: [super], key: p}
  - wait_stable: {max_changed_pct: 0.5, timeout_s: 10}
  - capture:
      name: workspace-overview
      category: S2
      stability: {max_changed_pct: 0.5, timeout_s: 8}
      image_checks: [not_black, not_white, size_matches_display]
      vlm:
        template: anomaly
        required: true
        min_confidence: 0.7
        expected:
          taskbar: visible
          anomalies_max: 0
        question: "Workspace overview: coherent workspace representations, selected workspace distinguishable, no duplicated application surfaces."

  - key: {key: Escape}
  - chord: {mods: [super], key: o}
  - wait_stable: {max_changed_pct: 0.5, timeout_s: 10}
  - capture:
      name: final-overview
      category: S3
      stability: {max_changed_pct: 0.5, timeout_s: 8}
      image_checks: [not_black, not_white, size_matches_display, {region_not_uniform: taskbar}]
      vlm:
        template: compare
        required: true
        min_confidence: 0.7
        compare_with: overview-all
        expected:
          taskbar: visible
          anomalies_max: 0
        question: "Overview after the full mode cycle: the same windows as the baseline overview, no window lost or duplicated, no corruption accumulated."

  # liveness through the whole sweep (spatial transparency invariant)
  - assert:
      client_json: {file: probe_1.json, expr: "sum(1 for e in events if e['ev']=='commit') >= 10"}
  - assert: {log_not_contains: {pattern: "surface destroyed", since: all_mapped}}
  - assert: {log_not_contains: {pattern: "panicked"}}
  - assert: {wayland_socket_alive: {}}
  - assert: {process_alive: {name: veyra}}
