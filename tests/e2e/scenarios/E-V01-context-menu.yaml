# E-V01 — Context menu: opens with the Menu key, closes via Escape and via
# click-outside, and never leaves a persistent ghost.
api: e2e/1
id: E-V01
title: "Context menu open/close — no ghost remains"
category: context-menu
priority: daily
tags: [shell, visual]
stack: x11
timeout_s: 120

requires:
  binaries: [veyra, client-kit]
  tools: [Xvfb, xdotool, import, identify, compare, python3]

veyra:
  args: ["--normal"]

steps:
  - launch:
      kit: probe
      args: ["--duration", "24000"]
      app_id: probe-a
      json: probe_a.json

  - wait_log:
      pattern: "surface mapped"
      app_id: probe-a
      within_s: 10
      anchor: probe_mapped

  - focus_x11: {}
  - click: {x: "{{ CX }}", y: "{{ CY }}"}

  - capture:
      name: baseline
      category: S0
      stability: {max_changed_pct: 0.3, timeout_s: 6}
      image_checks: [not_black, not_white, size_matches_display]

  - key: {key: Menu}
  - capture:
      name: menu-open
      category: S1
      stability: {max_changed_pct: 0.3, timeout_s: 6}
      image_checks: [not_black, not_white, size_matches_display]
      vlm:
        template: base
        required: true
        min_confidence: 0.7
        expected:
          windows: ["client-kit test window"]
          context_menu: true
          taskbar: visible
          anomalies_max: 0
        question: "A context menu must be visible near the selected window, listing entries such as Focus, Arrange, Maximize, Fullscreen, Minimize, Close."

  - key: {key: Escape}
  - capture:
      name: menu-closed-escape
      category: S2
      stability: {max_changed_pct: 0.3, timeout_s: 6}
      image_checks: [not_black, not_white, size_matches_display]
      vlm:
        template: compare
        required: true
        min_confidence: 0.7
        compare_with: baseline
        expected:
          context_menu: false
          anomalies_max: 0
        question: "The menu must be gone; the desktop must match the baseline with no menu remnants."

  - key: {key: Menu}
  - click: {x: 60, y: 60}
  - capture:
      name: menu-closed-click-outside
      category: S3
      stability: {max_changed_pct: 0.3, timeout_s: 6}
      image_checks: [not_black, not_white, size_matches_display]
      vlm:
        template: anomaly
        required: true
        min_confidence: 0.7
        expected:
          windows: ["client-kit test window"]
          context_menu: false
          taskbar: visible
          anomalies_max: 0
        question: "No context menu and no detached menu fragments may remain anywhere in the scene."

  - assert: {log_not_contains: {pattern: "panicked"}}
  - assert: {process_alive: {name: veyra}}
